{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>My events</h1>
  <a class="btn btn-primary" href="{{ url_for('create_event') }}">+ New event</a>
</div>
{% for event in events %}
  <div class="card mb-3"><div class="card-body d-flex justify-content-between align-items-center">
    <div><strong>{{ event.title }}</strong><br><small>{{ event.date.strftime('%d %b %Y, %H:%M') }}</small></div>
    <a class="btn btn-outline-primary" href="{{ url_for('manage', event_id=event.id) }}">Registrations</a>
  </div></div>
{% else %}
  <p>No events yet.</p>
{% endfor %}
{% endblock %}
