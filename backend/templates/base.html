<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}">EventFlow</a>
      <div>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('home') }}">Events</a>
        {% if current_user %}
          <a class="btn btn-sm btn-outline-primary" href="{{ url_for('dashboard') }}">Dashboard</a>
          <form class="d-inline" method="post" action="{{ url_for('logout') }}"><button class="btn btn-sm btn-outline-secondary">Log out</button></form>
        {% else %}
          <a class="btn btn-sm btn-primary" href="{{ url_for('login') }}">Organizer login</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container content-box">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
