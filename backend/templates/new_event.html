{% extends "base.html" %}
{% block content %}
<h1>Create event</h1>
<form method="post" class="card p-4 form-width">
  <label class="form-label">Event title</label>
  <input class="form-control mb-3" name="title" required>
  <label class="form-label">Description</label>
  <textarea class="form-control mb-3" name="description" rows="2"></textarea>
  <label class="form-label">Date and time</label>
  <input class="form-control mb-3" name="date" type="datetime-local" required>
  <label class="form-label">Location</label>
  <input class="form-control mb-3" name="location" required>
  <label class="form-label">Capacity</label>
  <input class="form-control mb-3" name="capacity" type="number" min="1" required>
  <button class="btn btn-primary">Create</button>
</form>
{% endblock %}
